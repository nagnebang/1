<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>메시지 시드 추가</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    button { padding: 12px 24px; background: #669999; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #status { margin-top: 16px; color: #333; }
  </style>
</head>
<body>
  <h2>응원 메시지 초기 데이터 추가</h2>
  <p>아래 버튼을 한 번만 클릭하면 응원 메시지 3개가 추가됩니다.</p>
  <button id="btn" onclick="seed()">메시지 추가하기</button>
  <div id="status"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    const messages = [
      {
        name: '정소희',
        message: '나그네방 덕분에 서울에서 처음 발을 뗄 수 있었어요. 낯선 도시에서 기댈 곳이 있다는 게 얼마나 큰 힘이 되는지 몰라요. 오래오래 계속되길 응원합니다!',
        photoURL: '',
        uid: 'seed-1',
        email: '',
        approved: true,
        createdAt: firebase.firestore.Timestamp.fromDate(new Date('2025-11-03')),
      },
      {
        name: '김태영',
        message: '친구가 나그네방에서 지냈는데, 그 이후로 친구가 많이 달라졌어요. 사람과 함께 사는 것의 힘을 다시 생각하게 됐습니다. 이런 공간이 더 많아지면 좋겠어요.',
        photoURL: '',
        uid: 'seed-2',
        email: '',
        approved: true,
        createdAt: firebase.firestore.Timestamp.fromDate(new Date('2025-12-18')),
      },
      {
        name: '박지은',
        message: '7년이라는 시간이 정말 대단하게 느껴져요. 방 한 칸을 내어준다는 단순한 마음이 이렇게 많은 사람의 삶을 바꿔놨을 줄이야. 앞으로도 응원할게요 :)',
        photoURL: '',
        uid: 'seed-3',
        email: '',
        approved: true,
        createdAt: firebase.firestore.Timestamp.fromDate(new Date('2026-01-07')),
      },
    ];

    async function seed() {
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.textContent = '추가 중...';
      try {
        for (const msg of messages) {
          await db.collection('messages').add(msg);
        }
        status.textContent = '✅ 완료! 메시지 3개가 추가되었습니다. 이 페이지는 닫아도 됩니다.';
      } catch (e) {
        status.textContent = '❌ 오류: ' + e.message;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
