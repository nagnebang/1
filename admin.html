<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나그네방 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ─── 기본 리셋 & 변수 ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #F3F1D9;
      --teal:  #669999;
      --teal-dark: #538585;
      --tan:   #CAB099;
      --ink:   #1C1C1A;
      --bg:    #FDFAF3;
      --white: #ffffff;
      --border: #E0DDD5;
      --muted: #888;
      --danger: #C0392B;
      --danger-bg: #fef0f0;
      --danger-border: #f5a5a5;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      font-size: 15px;
    }

    /* ─── 레이아웃 ─── */
    .wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ─── 헤더 ─── */
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 4px; }
    .page-header p  { color: var(--muted); font-size: .875rem; }

    /* ─── 로그인 ─── */
    .login-box {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 72px 0;
    }
    .btn-google {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 28px; border-radius: 40px;
      border: 1.5px solid var(--border);
      background: var(--white);
      cursor: pointer; font-size: 1rem;
      font-family: inherit; font-weight: 600;
      transition: box-shadow .2s;
    }
    .btn-google:hover { box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
    .login-hint { color: var(--muted); font-size: .85rem; }

    /* ─── 권한 없음 ─── */
    .no-access {
      text-align: center; padding: 72px 0; color: var(--danger);
    }
    .no-access p { margin-bottom: 16px; font-size: 1rem; }

    /* ─── 유저 바 ─── */
    .user-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px;
      background: var(--white); border-radius: 40px;
      margin-bottom: 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .user-bar img { width: 30px; height: 30px; border-radius: 50%; }
    .user-bar .user-name { flex: 1; font-weight: 600; font-size: .9rem; }

    /* ─── 버튼 공통 ─── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 20px;
      cursor: pointer; font-family: inherit; font-size: .875rem;
      font-weight: 500; border: none; transition: background .15s, box-shadow .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-sm   { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-size: .85rem; font-family: inherit; }
    .btn-sm:hover { background: var(--cream); }
    .btn-teal { background: var(--teal); color: var(--white); }
    .btn-teal:hover { background: var(--teal-dark); }
    .btn-outline-danger { background: var(--white); color: var(--danger); border: 1px solid var(--danger-border); }
    .btn-outline-danger:hover { background: var(--danger-bg); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--ink); }
    .btn-ghost:hover { background: var(--cream); }

    /* ─── 메인 탭 ─── */
    .main-tab-bar {
      display: flex; border-bottom: 2px solid var(--border);
      margin-bottom: 28px;
    }
    .main-tab {
      padding: 10px 22px; cursor: pointer;
      font-size: .9rem; color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color .15s, border-color .15s;
    }
    .main-tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--teal); }

    /* ─── 패널 ─── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ─── 배지 ─── */
    .badge {
      display: inline-block; background: #e74c3c; color: var(--white);
      border-radius: 10px; font-size: .72rem; padding: 1px 7px;
      margin-left: 6px; vertical-align: middle;
    }

    /* ════════════════════════════════
       TAB 1 : 메시지 검토
    ════════════════════════════════ */
    .sub-tab-bar {
      display: flex; gap: 4px; margin-bottom: 20px;
    }
    .sub-tab {
      padding: 7px 18px; border-radius: 20px;
      font-size: .875rem; cursor: pointer;
      border: 1px solid var(--border);
      background: var(--white); color: var(--muted);
      transition: background .15s, color .15s;
    }
    .sub-tab.active { background: var(--teal); color: var(--white); border-color: var(--teal); font-weight: 600; }

    .msg-card {
      background: var(--white); border-radius: 14px;
      padding: 20px; margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .msg-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .msg-card-header img { width: 36px; height: 36px; border-radius: 50%; }
    .avatar-ph {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--cream); display: flex;
      align-items: center; justify-content: center;
      font-weight: 700; font-size: .95rem; flex-shrink: 0;
    }
    .msg-meta strong { display: block; font-size: .9rem; margin-bottom: 1px; }
    .msg-meta .email { font-size: .78rem; color: #aaa; }
    .msg-date { margin-left: auto; font-size: .78rem; color: #bbb; white-space: nowrap; }
    .msg-text { font-size: .93rem; line-height: 1.75; color: #333; white-space: pre-wrap; }
    .msg-actions { margin-top: 14px; display: flex; gap: 10px; }

    /* ════════════════════════════════
       TAB 2 : 에세이 관리
    ════════════════════════════════ */
    .essay-list-table {
      width: 100%; border-collapse: collapse;
      background: var(--white); border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }
    .essay-list-table th, .essay-list-table td {
      padding: 12px 16px; text-align: left;
      font-size: .875rem; border-bottom: 1px solid var(--border);
    }
    .essay-list-table th { color: var(--muted); font-weight: 500; background: #faf8f0; }
    .essay-list-table tr:last-child td { border-bottom: none; }
    .essay-list-table td:last-child { text-align: right; }
    .cat-badge {
      font-size: .75rem; padding: 2px 8px; border-radius: 10px;
    }
    .cat-operator  { background: #e8f4f4; color: var(--teal-dark); }
    .cat-participant { background: #f5efe9; color: #8a6648; }

    /* ─── 접기/펼치기 폼 ─── */
    .collapsible-toggle {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      font-weight: 600; font-size: .9rem; color: var(--teal);
      margin-bottom: 16px;
    }
    .collapsible-toggle .arrow { transition: transform .2s; font-size: .75rem; }
    .collapsible-toggle.open .arrow { transform: rotate(90deg); }
    .collapsible-body { display: none; }
    .collapsible-body.open { display: block; }

    .form-card {
      background: var(--white); border-radius: 14px;
      padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }
    .form-row { margin-bottom: 16px; }
    .form-row label {
      display: block; font-size: .82rem; font-weight: 600;
      color: var(--muted); margin-bottom: 6px;
    }
    .form-row input[type="text"],
    .form-row input[type="number"],
    .form-row input[type="file"],
    .form-row select,
    .form-row textarea {
      width: 100%; padding: 10px 14px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: .9rem; color: var(--ink);
      background: var(--bg); outline: none;
      transition: border-color .15s;
    }
    .form-row input:focus,
    .form-row select:focus,
    .form-row textarea:focus { border-color: var(--teal); }
    .form-row textarea { resize: vertical; line-height: 1.65; }
    .form-row input[type="file"] { padding: 8px; }
    .form-hint { font-size: .78rem; color: var(--muted); margin-top: 5px; }
    .form-row-inline { display: flex; gap: 16px; }
    .form-row-inline .form-row { flex: 1; }

    .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 6px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ─── 시드 버튼 영역 ─── */
    .seed-area {
      padding: 16px 20px; background: var(--cream);
      border-radius: 10px; display: flex;
      align-items: center; justify-content: space-between; gap: 12px;
    }
    .seed-area p { font-size: .85rem; color: #666; }

    /* ════════════════════════════════
       TAB 3 : 갤러리 관리
    ════════════════════════════════ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px; margin-bottom: 20px;
    }
    .gallery-item {
      background: var(--white); border-radius: 12px;
      overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .gallery-thumb {
      width: 100%; height: 140px;
      object-fit: cover; display: block;
    }
    .gallery-info {
      padding: 10px 12px;
    }
    .gallery-caption { font-size: .82rem; color: var(--ink); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .size-badge {
      display: inline-block; font-size: .72rem;
      padding: 1px 7px; border-radius: 8px;
      background: var(--cream); color: #777;
      margin-bottom: 8px;
    }
    .gallery-delete { width: 100%; }

    /* ─── URL 또는 파일 선택 토글 ─── */
    .radio-toggle { display: flex; gap: 20px; margin-bottom: 12px; }
    .radio-toggle label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: .875rem; }

    /* ─── 빈 상태 ─── */
    .empty { text-align: center; padding: 48px 0; color: #aaa; font-size: .9rem; }

    /* ─── 토스트 ─── */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--white);
      padding: 12px 24px; border-radius: 24px;
      font-size: .875rem; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
      z-index: 9999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    #toast.error { background: var(--danger); }
  </style>
</head>
<body>
<div class="wrap">

  <!-- ── 페이지 헤더 ── -->
  <div class="page-header">
    <h1>나그네방 관리자</h1>
    <p>메시지 검토, 에세이 및 갤러리를 관리합니다.</p>
  </div>

  <!-- ── 로그인 전 ── -->
  <div id="loginBox" class="login-box">
    <button class="btn-google" id="adminLoginBtn">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      구글 계정으로 로그인
    </button>
    <p class="login-hint">관리자 계정(nagenabang@gmail.com)으로 로그인하세요.</p>
  </div>

  <!-- ── 권한 없음 ── -->
  <div id="noAccess" class="no-access" style="display:none">
    <p>⛔ 이 계정은 관리자 권한이 없습니다.</p>
    <button class="btn btn-ghost btn-sm" id="noAccessLogout" style="margin-top:16px;">다른 계정으로 로그인</button>
  </div>

  <!-- ── 관리자 패널 ── -->
  <div id="adminPanel" style="display:none">

    <!-- 유저 바 -->
    <div class="user-bar">
      <img id="adminPhoto" src="" alt="" />
      <span class="user-name" id="adminName"></span>
      <button class="btn-sm" id="adminLogoutBtn">로그아웃</button>
    </div>

    <!-- 메인 탭 -->
    <div class="main-tab-bar">
      <div class="main-tab active" data-tab="messages">메시지 검토 <span class="badge" id="pendingCount">0</span></div>
      <div class="main-tab"        data-tab="essays">에세이 관리</div>
      <div class="main-tab"        data-tab="gallery">갤러리 관리</div>
    </div>

    <!-- ════════ PANEL: 메시지 검토 ════════ -->
    <div class="panel active" id="panel-messages">

      <div class="sub-tab-bar">
        <div class="sub-tab active" data-sub="pending" id="subTabPending">검토 대기 <span class="badge" id="pendingCountSub">0</span></div>
        <div class="sub-tab"        data-sub="approved" id="subTabApproved">승인된 메시지</div>
      </div>

      <div id="pendingList"></div>
      <div id="approvedList" style="display:none"></div>
    </div>

    <!-- ════════ PANEL: 에세이 관리 ════════ -->
    <div class="panel" id="panel-essays">

      <!-- 기존 에세이 목록 -->
      <div id="essayTableWrap">
        <p class="empty">불러오는 중...</p>
      </div>

      <!-- 에세이 추가 폼 (접기/펼치기) -->
      <div class="collapsible-toggle" id="essayFormToggle">
        <span class="arrow">▶</span> 에세이 추가
      </div>
      <div class="collapsible-body" id="essayFormBody">
        <div class="form-card">
          <div class="form-row">
            <label>제목 *</label>
            <input type="text" id="eTitle" placeholder="에세이 제목" />
          </div>
          <div class="form-row-inline">
            <div class="form-row">
              <label>날짜</label>
              <input type="text" id="eDate" placeholder="2025. 8. 24" />
            </div>
            <div class="form-row">
              <label>글쓴이</label>
              <input type="text" id="eAuthor" placeholder="운영자 유하영" />
            </div>
          </div>
          <div class="form-row-inline">
            <div class="form-row">
              <label>구분</label>
              <select id="eCategory">
                <option value="operator">운영자 에세이</option>
                <option value="participant">나그네 &amp; 가족 에세이</option>
              </select>
            </div>
            <div class="form-row">
              <label>순서</label>
              <input type="number" id="eOrder" value="99" min="0" />
            </div>
          </div>
          <div class="form-row">
            <label>썸네일 이미지 URL</label>
            <input type="text" id="eThumb" placeholder="images/invitation.jpeg 또는 외부 URL (선택사항)" />
          </div>
          <div class="form-row">
            <label>본문 *</label>
            <textarea id="eBody" rows="12" placeholder="에세이 본문을 입력하세요..."></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" id="essayCancelBtn">취소</button>
            <button class="btn btn-teal" id="essaySaveBtn">저장</button>
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- 시드 데이터 -->
      <div class="seed-area">
        <p>에세이 컬렉션이 비어있을 때만 기존 데이터를 가져옵니다.</p>
        <button class="btn btn-ghost" id="seedEssaysBtn">기존 데이터 가져오기</button>
      </div>
    </div>

    <!-- ════════ PANEL: 갤러리 관리 ════════ -->
    <div class="panel" id="panel-gallery">

      <!-- 현재 갤러리 그리드 -->
      <div id="galleryGrid" class="gallery-grid">
        <p class="empty" style="grid-column:1/-1">불러오는 중...</p>
      </div>

      <!-- 사진 추가 폼 (접기/펼치기) -->
      <div class="collapsible-toggle" id="galleryFormToggle">
        <span class="arrow">▶</span> 사진 추가
      </div>
      <div class="collapsible-body" id="galleryFormBody">
        <div class="form-card">

          <!-- 파일 or URL 선택 -->
          <div class="form-row">
            <label>이미지 선택 방식</label>
            <div class="radio-toggle">
              <label><input type="radio" name="imgMode" value="file" id="imgModeFile" checked /> 파일 업로드</label>
              <label><input type="radio" name="imgMode" value="url" id="imgModeUrl" /> URL 직접 입력</label>
            </div>
            <div id="gFileWrap">
              <input type="file" id="gFile" accept="image/*" />
              <p class="form-hint">Firebase Storage에 업로드됩니다.</p>
            </div>
            <div id="gUrlWrap" style="display:none">
              <input type="text" id="gUrl" placeholder="https:// 또는 images/..." />
            </div>
          </div>

          <div class="form-row-inline">
            <div class="form-row">
              <label>설명 (alt)</label>
              <input type="text" id="gAlt" placeholder="사진 설명 (접근성)" />
            </div>
            <div class="form-row">
              <label>캡션</label>
              <input type="text" id="gCaption" placeholder="갤러리에 표시될 캡션" />
            </div>
          </div>

          <div class="form-row-inline">
            <div class="form-row">
              <label>크기</label>
              <select id="gSize">
                <option value="normal">기본 (normal)</option>
                <option value="tall">g-tall (세로 긴 사진)</option>
                <option value="wide">g-wide (가로 넓은 사진)</option>
              </select>
            </div>
            <div class="form-row">
              <label>순서</label>
              <input type="number" id="gOrder" value="99" min="0" />
            </div>
          </div>

          <div class="form-actions">
            <button class="btn btn-ghost" id="galleryCancelBtn">취소</button>
            <button class="btn btn-teal" id="gallerySaveBtn">저장</button>
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- 시드 데이터 -->
      <div class="seed-area">
        <p>갤러리 컬렉션이 비어있을 때만 기존 사진을 가져옵니다.</p>
        <button class="btn btn-ghost" id="seedGalleryBtn">기존 데이터 가져오기</button>
      </div>
    </div>

  </div><!-- /adminPanel -->
</div><!-- /wrap -->

<!-- ── 토스트 ── -->
<div id="toast"></div>

<!-- ── Firebase ── -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
/* ══════════════════════════════════════════════════════
   시드 데이터
══════════════════════════════════════════════════════ */
const SEED_ESSAYS = [

/* ══════════════════════════════════════════════════════
   유틸리티
══════════════════════════════════════════════════════ */
function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtDate(d) {
  if (!d) return '';
  return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let toastTimer = null;
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('adminLoginBtn').addEventListener('click', () => {

});
document.getElementById('adminLogoutBtn').addEventListener('click', () => auth.signOut());
document.getElementById('noAccessLogout').addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(user => {
  const loginBox   = document.getElementById('loginBox');
  const noAccess   = document.getElementById('noAccess');
  const adminPanel = document.getElementById('adminPanel');

  // 리스너 정리
  const cleanUp = () => {
    [unsubPending, unsubApproved, unsubEssays, unsubGallery].forEach(fn => fn && fn());
    unsubPending = unsubApproved = unsubEssays = unsubGallery = null;
  };

  if (!user) {
    cleanUp();
    loginBox.style.display   = 'flex';
    noAccess.style.display   = 'none';
    adminPanel.style.display = 'none';
    return;
  }

  if (user.email !== ADMIN_EMAIL) {
    cleanUp();
    loginBox.style.display   = 'none';
    noAccess.style.display   = 'block';
    adminPanel.style.display = 'none';
    return;
  }

  loginBox.style.display   = 'none';
  noAccess.style.display   = 'none';
  adminPanel.style.display = 'block';
  document.getElementById('adminPhoto').src       = user.photoURL || '';
  document.getElementById('adminPhoto').alt       = user.displayName || '';
  document.getElementById('adminName').textContent = user.displayName || user.email;

  startListeners();
});

function initCollapsible(toggleId, bodyId) {
  const toggle = document.getElementById(toggleId);
  const body   = document.getElementById(bodyId);
  toggle.addEventListener('click', () => {
    const open = body.classList.toggle('open');
    toggle.classList.toggle('open', open);
  });
}
initCollapsible('essayFormToggle', 'essayFormBody');
initCollapsible('galleryFormToggle', 'galleryFormBody');

function collapseForm(toggleId, bodyId) {
  document.getElementById(bodyId).classList.remove('open');
  document.getElementById(toggleId).classList.remove('open');
}

   TAB 1 – 메시지 검토
══════════════════════════════════════════════════════ */
function startMessages() {
  // 검토 대기
  unsubPending = db.collection('messages')
    .where('approved', '==', false)
    .orderBy('createdAt', 'asc')
    .onSnapshot(snap => {
      const n = snap.size;
      document.getElementById('pendingCount').textContent    = n;
      document.getElementById('pendingCountSub').textContent = n;
      renderMessages(snap.docs, 'pendingList', true);
    }, err => showToast('메시지 불러오기 실패: ' + err.message, true));

  // 승인된 메시지
  unsubApproved = db.collection('messages')
    .where('approved', '==', true)
    .orderBy('createdAt', 'desc')
    .limit(80)
    .onSnapshot(snap => {
      renderMessages(snap.docs, 'approvedList', false);
    }, err => showToast('승인 메시지 불러오기 실패: ' + err.message, true));
}

function renderMessages(docs, containerId, showApprove) {
  const container = document.getElementById(containerId);
  if (docs.length === 0) {
    container.innerHTML = '<p class="empty">메시지가 없습니다.</p>';
    return;
  }
  container.innerHTML = docs.map(doc => {
    const d    = doc.data();
    const date = d.createdAt ? fmtDate(d.createdAt.toDate()) : '저장 중';
    const avatar = d.photoURL
      ? `<img src="${esc(d.photoURL)}" alt="" />`
      : `<div class="avatar-ph">${esc(d.name)[0] || '?'}</div>`;
    return `<div class="msg-card">
      <div class="msg-card-header">
        ${avatar}
        <div class="msg-meta">
          <strong>${esc(d.name)}</strong>
          <div class="email">${esc(d.email)}</div>
        </div>
        <span class="msg-date">${esc(date)}</span>
      </div>
      <p class="msg-text">${esc(d.message)}</p>
      <div class="msg-actions">
        ${showApprove ? `<button class="btn btn-teal" onclick="approveMsg('${doc.id}')">✓ 승인</button>` : ''}
        <button class="btn btn-outline-danger" onclick="deleteMsg('${doc.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');
}

async function approveMsg(id) {
  try {
    await db.collection('messages').doc(id).update({ approved: true });
    showToast('메시지를 승인했습니다.');
  } catch(e) {
    showToast('승인 실패: ' + e.message, true);
  }
}

async function deleteMsg(id) {
  if (!confirm('이 메시지를 삭제하시겠습니까?')) return;
  try {
    await db.collection('messages').doc(id).delete();
    showToast('메시지를 삭제했습니다.');
  } catch(e) {
    showToast('삭제 실패: ' + e.message, true);
  }
}

function startEssays() {
  unsubEssays = db.collection('essays')
    .orderBy('order', 'asc')
    .onSnapshot(snap => {
      renderEssayTable(snap.docs);
    }, err => showToast('에세이 불러오기 실패: ' + err.message, true));
}

function renderEssayTable(docs) {
  const wrap = document.getElementById('essayTableWrap');
  if (docs.length === 0) {
    wrap.innerHTML = '<p class="empty">에세이가 없습니다. 아래에서 추가하거나 기존 데이터를 가져오세요.</p>';
    return;
  }
  const rows = docs.map(doc => {
    const d = doc.data();
    const catLabel = d.category === 'operator' ? '운영자' : '나그네&가족';
    const catClass = d.category === 'operator' ? 'cat-operator' : 'cat-participant';
    return `<tr>
      <td>${esc(d.title)}</td>
      <td>${esc(d.author || '')}</td>
      <td><span class="cat-badge ${catClass}">${esc(catLabel)}</span></td>
      <td>${esc(d.date || '')}</td>
      <td><button class="btn btn-outline-danger btn" style="padding:5px 12px;font-size:.8rem" onclick="deleteEssay('${doc.id}')">삭제</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `
    <table class="essay-list-table">
      <thead><tr>
        <th>제목</th><th>글쓴이</th><th>구분</th><th>날짜</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// 에세이 저장
document.getElementById('essaySaveBtn').addEventListener('click', async () => {
  const title  = document.getElementById('eTitle').value.trim();
  const body   = document.getElementById('eBody').value.trim();
  if (!title) { showToast('제목을 입력하세요.', true); return; }
  if (!body)  { showToast('본문을 입력하세요.', true); return; }

  const btn = document.getElementById('essaySaveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  try {
    await db.collection('essays').add({
      title,
      date:       document.getElementById('eDate').value.trim(),
      author:     document.getElementById('eAuthor').value.trim(),
      category:   document.getElementById('eCategory').value,
      thumbImage: document.getElementById('eThumb').value.trim(),
      body,
      order:      Number(document.getElementById('eOrder').value) || 99,
      createdAt:  firebase.firestore.FieldValue.serverTimestamp(),
    });
    showToast('에세이를 저장했습니다.');
    resetEssayForm();
    collapseForm('essayFormToggle', 'essayFormBody');
  } catch(e) {
    showToast('저장 실패: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '저장';
  }
});

document.getElementById('essayCancelBtn').addEventListener('click', () => {
  resetEssayForm();
  collapseForm('essayFormToggle', 'essayFormBody');
});

function resetEssayForm() {
  ['eTitle','eDate','eAuthor','eThumb','eBody'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('eCategory').value = 'operator';
  document.getElementById('eOrder').value    = '99';
}

async function deleteEssay(id) {
  if (!confirm('이 에세이를 삭제하시겠습니까?')) return;
  try {
    await db.collection('essays').doc(id).delete();
    showToast('에세이를 삭제했습니다.');
  } catch(e) {
    showToast('삭제 실패: ' + e.message, true);
  }
}

// 에세이 시드
document.getElementById('seedEssaysBtn').addEventListener('click', async () => {
  const snap = await db.collection('essays').limit(1).get();
  if (!snap.empty) { alert('이미 데이터가 있습니다.'); return; }
  if (!confirm(`에세이 ${SEED_ESSAYS.length}개를 가져오겠습니까?`)) return;

  const btn = document.getElementById('seedEssaysBtn');
  btn.disabled = true;
  try {
    const batch = db.batch();
    SEED_ESSAYS.forEach(e => {
      const ref = db.collection('essays').doc();
      batch.set(ref, { ...e, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
    showToast(`에세이 ${SEED_ESSAYS.length}개를 가져왔습니다.`);
  } catch(e) {
    showToast('시드 실패: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

    return;

  const sizeLabel = { normal:'기본', tall:'g-tall', wide:'g-wide' };
  grid.innerHTML = docs.map(doc => {

      </div>
    </div>`;
  }).join('');
}

// 갤러리 저장
document.getElementById('gallerySaveBtn').addEventListener('click', async () => {
  const isFile   = document.getElementById('imgModeFile').checked;
  const fileEl   = document.getElementById('gFile');
  const urlVal   = document.getElementById('gUrl').value.trim();
  const alt      = document.getElementById('gAlt').value.trim();
  const caption  = document.getElementById('gCaption').value.trim();
  const size     = document.getElementById('gSize').value;
  const order    = Number(document.getElementById('gOrder').value) || 99;

  if (isFile && !fileEl.files[0]) { showToast('사진 파일을 선택하세요.', true); return; }
  if (!isFile && !urlVal)          { showToast('이미지 URL을 입력하세요.', true); return; }

  const btn = document.getElementById('gallerySaveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  try {
    let imageUrl   = urlVal;
    let storageRef = null;

    if (isFile) {
      const file      = fileEl.files[0];
      const refPath   = `gallery/${Date.now()}_${file.name}`;
      const ref       = storage.ref(refPath);
      await ref.put(file);
      imageUrl   = await ref.getDownloadURL();
      storageRef = refPath;
    }

    await db.collection('gallery').add({
      imageUrl, storageRef, alt, caption, size, order,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    showToast('사진을 저장했습니다.');
    resetGalleryForm();
    collapseForm('galleryFormToggle', 'galleryFormBody');
  } catch(e) {
    showToast('저장 실패: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '저장';
  }
});

document.getElementById('galleryCancelBtn').addEventListener('click', () => {
  resetGalleryForm();
  collapseForm('galleryFormToggle', 'galleryFormBody');
});

function resetGalleryForm() {
  document.getElementById('gFile').value    = '';
  document.getElementById('gUrl').value     = '';
  document.getElementById('gAlt').value     = '';
  document.getElementById('gCaption').value = '';
  document.getElementById('gSize').value    = 'normal';
  document.getElementById('gOrder').value   = '99';
  // 파일 모드로 초기화
  document.getElementById('imgModeFile').checked = true;
  document.getElementById('gFileWrap').style.display = 'block';
  document.getElementById('gUrlWrap').style.display  = 'none';
}

async function deleteGallery(id, storageRefPath) {
  if (!confirm('이 사진을 삭제하시겠습니까?')) return;
  try {
    if (storageRefPath) {
      await storage.ref(storageRefPath).delete().catch(() => {});
    }
    await db.collection('gallery').doc(id).delete();
    showToast('사진을 삭제했습니다.');
  } catch(e) {
    showToast('삭제 실패: ' + e.message, true);
  }
}

// 갤러리 시드
document.getElementById('seedGalleryBtn').addEventListener('click', async () => {
  const snap = await db.collection('gallery').limit(1).get();
  if (!snap.empty) { alert('이미 데이터가 있습니다.'); return; }
  if (!confirm(`갤러리 사진 ${SEED_GALLERY.length}개를 가져오겠습니까?`)) return;

  const btn = document.getElementById('seedGalleryBtn');
  btn.disabled = true;
  try {
    const batch = db.batch();
    SEED_GALLERY.forEach(g => {
      const ref = db.collection('gallery').doc();
      batch.set(ref, { ...g, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    await batch.commit();
    showToast(`갤러리 사진 ${SEED_GALLERY.length}개를 가져왔습니다.`);
  } catch(e) {
    showToast('시드 실패: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
});

/* ══════════════════════════════════════════════════════
   전체 리스너 시작
══════════════════════════════════════════════════════ */
function startListeners() {

}
